<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whiteboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #ffffff;
  }

  .ruler {
    position: fixed;
    background: #f8f8f8;
    z-index: 500;
    overflow: hidden;
  }

  .ruler-top {
    top: 0;
    left: 30px;
    right: 0;
    height: 30px;
    border-bottom: 1px solid #ccc;
    display: none;
  }

  .ruler-left {
    top: 0;
    left: 0;
    bottom: 30px;
    width: 30px;
    border-right: 1px solid #ccc;
  }

  .ruler-bottom {
    bottom: 0;
    left: 30px;
    right: 0;
    height: 30px;
    border-top: 1px solid #ccc;
  }

  .ruler-corner {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 30px;
    height: 30px;
    background: #f0f0f0;
    border-top: 1px solid #ccc;
    border-right: 1px solid #ccc;
    z-index: 501;
  }

  .ruler canvas {
    display: block;
  }

  #canvas {
    position: absolute;
    top: 0;
    left: 30px;
    right: 0;
    bottom: 30px;
  }

  .fab {
    position: fixed;
    bottom: 54px;
    right: 24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 1000;
    transition: box-shadow 0.2s;
  }
  .fab:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
  .fab svg { width: 22px; height: 22px; stroke: #555; fill: none; }

  .popover {
    position: fixed;
    bottom: 112px;
    right: 24px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 1000;
    display: none;
    width: 200px;
  }
  .popover.open { display: block; }

  .popover h3 {
    font-family: system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .color-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .color-row label {
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: #333;
  }
  .color-row input[type="color"] {
    width: 32px;
    height: 32px;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    padding: 2px;
  }

  .grid-options {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .grid-btn {
    font-family: system-ui, sans-serif;
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid #eee;
    border-radius: 6px;
    background: #fafafa;
    cursor: pointer;
    text-align: left;
    color: #333;
    transition: background 0.15s, border-color 0.15s;
  }
  .grid-btn:hover { background: #f0f0f0; }
  .grid-btn.active {
    background: #e8f0fe;
    border-color: #4a90d9;
    color: #1a5fb4;
  }
</style>
</head>
<body>

<div class="ruler ruler-left"><canvas id="rulerLeft"></canvas></div>
<div class="ruler ruler-bottom"><canvas id="rulerBottom"></canvas></div>
<div class="ruler-corner"></div>

<div id="canvas"></div>

<button class="fab" id="fab" title="Background options">
  <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <line x1="3" y1="9" x2="21" y2="9"/>
    <line x1="3" y1="15" x2="21" y2="15"/>
    <line x1="9" y1="3" x2="9" y2="21"/>
    <line x1="15" y1="3" x2="15" y2="21"/>
  </svg>
</button>

<div class="popover" id="popover">
  <h3>Background</h3>
  <div class="color-row">
    <label>Color</label>
    <input type="color" id="bgColor" value="#ffffff">
  </div>
  <h3>Grid</h3>
  <div class="grid-options">
    <button class="grid-btn active" data-grid="none">None</button>
    <button class="grid-btn" data-grid="dots">Dots</button>
    <button class="grid-btn" data-grid="lines">Lines</button>
    <button class="grid-btn" data-grid="cross">Cross</button>
  </div>
</div>

<script>
  const fab = document.getElementById('fab');
  const popover = document.getElementById('popover');
  const bgColorInput = document.getElementById('bgColor');
  const gridBtns = document.querySelectorAll('.grid-btn');
  const canvas = document.getElementById('canvas');

  let currentGrid = 'none';
  let bgColor = '#ffffff';

  // --- Rulers ---
  const rulerLeftCanvas = document.getElementById('rulerLeft');
  const rulerBottomCanvas = document.getElementById('rulerBottom');
  const dpr = window.devicePixelRatio || 1;
  const RULER_SIZE = 30;
  const TICK_INTERVAL = 50; // pixels between major ticks
  const MINOR_TICKS = 5;   // minor ticks per major tick

  function drawRulers() {
    drawLeftRuler();
    drawBottomRuler();
  }

  function drawLeftRuler() {
    const container = rulerLeftCanvas.parentElement;
    const w = RULER_SIZE;
    const h = container.clientHeight;
    rulerLeftCanvas.width = w * dpr;
    rulerLeftCanvas.height = h * dpr;
    rulerLeftCanvas.style.width = w + 'px';
    rulerLeftCanvas.style.height = h + 'px';

    const ctx = rulerLeftCanvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    ctx.fillStyle = '#999';
    ctx.font = '9px system-ui, sans-serif';
    ctx.textAlign = 'center';

    const minorInterval = TICK_INTERVAL / MINOR_TICKS;

    for (let y = 0; y <= h; y += minorInterval) {
      const isMajor = Math.round(y) % TICK_INTERVAL === 0;
      const tickLen = isMajor ? 10 : 5;
      ctx.beginPath();
      ctx.moveTo(w, y);
      ctx.lineTo(w - tickLen, y);
      ctx.strokeStyle = isMajor ? '#999' : '#ccc';
      ctx.lineWidth = isMajor ? 1 : 0.5;
      ctx.stroke();

      if (isMajor && y > 0) {
        ctx.save();
        ctx.translate(10, y - 3);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(Math.round(y).toString(), 0, 0);
        ctx.restore();
      }
    }
  }

  function drawBottomRuler() {
    const container = rulerBottomCanvas.parentElement;
    const w = container.clientWidth;
    const h = RULER_SIZE;
    rulerBottomCanvas.width = w * dpr;
    rulerBottomCanvas.height = h * dpr;
    rulerBottomCanvas.style.width = w + 'px';
    rulerBottomCanvas.style.height = h + 'px';

    const ctx = rulerBottomCanvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    ctx.fillStyle = '#999';
    ctx.font = '9px system-ui, sans-serif';
    ctx.textAlign = 'center';

    const minorInterval = TICK_INTERVAL / MINOR_TICKS;

    for (let x = 0; x <= w; x += minorInterval) {
      const isMajor = Math.round(x) % TICK_INTERVAL === 0;
      const tickLen = isMajor ? 10 : 5;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, tickLen);
      ctx.strokeStyle = isMajor ? '#999' : '#ccc';
      ctx.lineWidth = isMajor ? 1 : 0.5;
      ctx.stroke();

      if (isMajor && x > 0) {
        ctx.fillText(Math.round(x).toString(), x, 20);
      }
    }
  }

  drawRulers();
  window.addEventListener('resize', drawRulers);

  // --- FAB / Popover ---
  fab.addEventListener('click', (e) => {
    e.stopPropagation();
    popover.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!popover.contains(e.target) && e.target !== fab) {
      popover.classList.remove('open');
    }
  });

  function onColorChange(e) {
    bgColor = e.target.value;
    applyBackground();
  }
  bgColorInput.addEventListener('input', onColorChange);
  bgColorInput.addEventListener('change', onColorChange);

  gridBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      gridBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentGrid = btn.dataset.grid;
      applyBackground();
    });
  });

  function getGridColor() {
    const r = parseInt(bgColor.slice(1, 3), 16);
    const g = parseInt(bgColor.slice(3, 5), 16);
    const b = parseInt(bgColor.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.15)';
  }

  function applyBackground() {
    const gc = getGridColor();
    const size = 20;
    document.body.style.backgroundColor = bgColor;

    switch (currentGrid) {
      case 'none':
        canvas.style.backgroundImage = 'none';
        canvas.style.backgroundSize = '';
        break;

      case 'dots':
        canvas.style.backgroundImage = `radial-gradient(circle, ${gc} 1px, transparent 1px)`;
        canvas.style.backgroundSize = `${size}px ${size}px`;
        break;

      case 'lines':
        canvas.style.backgroundImage = `
          linear-gradient(${gc} 1px, transparent 1px),
          linear-gradient(90deg, ${gc} 1px, transparent 1px)`;
        canvas.style.backgroundSize = `${size}px ${size}px`;
        break;

      case 'cross':
        canvas.style.backgroundImage = `
          linear-gradient(${gc} 1px, transparent 1px),
          linear-gradient(90deg, ${gc} 1px, transparent 1px),
          linear-gradient(${gc} 0.5px, transparent 0.5px),
          linear-gradient(90deg, ${gc} 0.5px, transparent 0.5px)`;
        canvas.style.backgroundSize = `${size * 5}px ${size * 5}px, ${size * 5}px ${size * 5}px, ${size}px ${size}px, ${size}px ${size}px`;
        break;
    }
  }
</script>
</body>
</html>
